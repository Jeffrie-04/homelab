## All credentials live in the `nextcloud-credentials` SealedSecret
## (apps/nextcloud/sealed-secret.yaml). Never put a password in this file.
## Required keys: nextcloud-username, nextcloud-password, db-username,
##                db-password, postgres-password, redis-password

nextcloud:
  host: 192.168.1.50
  existingSecret:
    enabled: true
    secretName: nextcloud-credentials
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
  trustedDomains:
    - 192.168.1.50
    - 192.168.1.51
    - 192.168.1.52
    - 192.168.1.53
    - 10.42.0.0/16
  persistence:
    subPath:

internalDatabase:
  enabled: false

# Nextcloud reads its DB credentials from here, even with the bundled PostgreSQL
externalDatabase:
  existingSecret:
    enabled: true
    secretName: nextcloud-credentials
    usernameKey: db-username
    passwordKey: db-password

postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        username: nextcloud
        database: nextcloud
        existingSecret: nextcloud-credentials
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: db-password
  primary:
    persistence:
      enabled: true

redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: nextcloud-credentials
    existingSecretPasswordKey: redis-password

persistence:
  enabled: true
  existingClaim: nextcloud-pvc
  accessMode: ReadWriteMany

livenessProbe:
  enabled: false
  initialDelaySeconds: 120
readinessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 30
  failureThreshold: 10

# Previously set by hand (kubectl patch). Tracked here so Helm owns it.
service:
  type: LoadBalancer
  port: 8080
