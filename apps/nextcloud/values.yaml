nextcloud:
  host: 192.168.1.50
  username: admin
  password: "REDACTED"
  trustedDomains:
    - 192.168.1.50
  persistence:
    subPath:

internalDatabase:
  enabled: false

postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        username: nextcloud
        password: "REDACTED"
        database: nextcloud
  primary:
    persistence:
      enabled: true

redis:
  enabled: true
  auth:
    password: "REDACTED"

persistence:
  enabled: true
  existingClaim: nextcloud-pvc
  accessMode: ReadWriteMany

livenessProbe:
  enabled: false
  initialDelaySeconds: 120
readinessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 30
  failureThreshold: 10
